name: weather_tracking
description: "Smart Weather App v2 — Firebase + Flutter"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.9
  cloud_functions: ^5.3.5
  firebase_messaging: ^15.2.5
  firebase_storage: ^12.4.5
  google_sign_in: ^6.2.1

  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^15.1.2
  flutter_animate: ^4.5.2

  # Location
  geolocator: ^14.0.2
  permission_handler: ^12.0.3
  geocoding: ^4.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
